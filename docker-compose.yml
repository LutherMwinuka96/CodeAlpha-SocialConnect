services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codealpha}
      POSTGRES_USER: ${POSTGRES_USER:-codealpha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connect-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codealpha} -d ${POSTGRES_DB:-codealpha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-codealpha}:${POSTGRES_PASSWORD:-connect-local-only}@db:5432/${POSTGRES_DB:-codealpha}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:8000}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
